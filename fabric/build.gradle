plugins {
    id 'fabric-loom'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.+'
    id 'io.github.flemmli97.multiloader.platform-fabric'
}

repositories {
    mavenCentral()
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'io.github.ladysnake'
            includeGroupByRegex 'io\\.github\\.onyxstudios.*'
        }
    }
    maven {
        url = "https://maven.jamieswhiteshirt.com/libs-release/"
        content {
            includeGroup 'com.jamieswhiteshirt'
        }
    }
    maven {
        url = "https://maven.nucleoid.xyz/"
        content {
            includeGroup 'eu.pb4'
        }
    }
    maven {
        name = "Create Fabric"
        url = "https://mvn.devos.one/snapshots"
        content {
            includeGroupByRegex 'io.github.fabricators_of_create.*'
            includeGroup 'com.simibubi.create'
        }
    }
}

dependencies {
    modImplementation include("io.github.flemmli97:lingua_bib:${lingua_bib}-fabric")
    implementation include('org.yaml:snakeyaml:2.4')

    remapCommon(modCompileOnly("io.github.fabricators_of_create.Porting-Lib:entity:${porting_lib}"))
    remapCommon(modCompileOnly("com.simibubi.create:create-fabric-1.20.1:${create_fabric}")) {
        transitive = false
    }

    modImplementation "me.lucko:fabric-permissions-api:${fabric_permissions_api}"
    modImplementation (octo_economy_api) {
        exclude group: "net.fabricmc.fabric-api"
    }
    modCompileOnly diamond_economy

    modCompileOnly "io.github.ladysnake:PlayerAbilityLib:${player_ability_lib}"

    //modRuntimeOnly "dev.ftb.mods:ftb-ranks-fabric:${ftb_ranks}"
    //modRuntimeOnly "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks}"
    //CompileOnly cause too many dependency
    modCompileOnly goml_reserved
    modCompileOnly "com.jamieswhiteshirt:rtree-3i-lite-fabric:0.3.0"

    modCompileOnly harvest_with_ease_fabric
    modCompileOnly "eu.pb4:common-protection-api:${common_prot_api}"
}

tasks.register('apiJar', Jar) {
    dependsOn classes
    archiveClassifier.set "api-source"
    from sourceSets.main.output
    include "io/github/flemmli97/flan/api/**"
    include "fabric.mod_api.json" //Include this so it gets remapped as a dependency
    rename("fabric.mod_api.json", "fabric.mod.json")
}

tasks.register('remapApiJar', net.fabricmc.loom.task.RemapJarTask) {
    archiveClassifier.set "api"
    input.set apiJar.archiveFile
    addNestedDependencies = false
    dependsOn apiJar
    from sourceSets.main.output
    /* Putting it here doesnt seem to work...
    include "fabric.mod_api.json" //Include this so it gets remapped as a dependency
    rename("fabric.mod_api.json", "fabric.mod.json")
    */
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(remapApiJar) {
                builtBy remapApiJar
            }
        }
    }
}